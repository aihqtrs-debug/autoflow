<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8cff"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff5c7a"/>
    </marker>
  </defs>
  <rect width="1180" height="760" fill="#0b0e14"/>
  <text x="30" y="40" fill="#e6e9f0" font-size="22" font-weight="700">AutoFlow — Architecture</text>
  <text x="30" y="62" fill="#8891a7" font-size="13">Serverless file processing &amp; orchestration on AWS</text>

  <!-- User -->
  <rect x="30" y="100" width="150" height="60" rx="10" fill="#171c28" stroke="#232939"/>
  <text x="105" y="126" fill="#e6e9f0" font-size="13" text-anchor="middle">Browser</text>
  <text x="105" y="144" fill="#8891a7" font-size="11" text-anchor="middle">Dashboard (S3+CDN)</text>

  <!-- CloudFront/S3 frontend -->
  <rect x="230" y="100" width="160" height="60" rx="10" fill="#171c28" stroke="#232939"/>
  <text x="310" y="126" fill="#e6e9f0" font-size="13" text-anchor="middle">CloudFront</text>
  <text x="310" y="144" fill="#8891a7" font-size="11" text-anchor="middle">+ S3 (private, OAC)</text>

  <!-- Cognito -->
  <rect x="440" y="100" width="150" height="60" rx="10" fill="#1c2333" stroke="#5b8cff"/>
  <text x="515" y="126" fill="#e6e9f0" font-size="13" text-anchor="middle">Cognito</text>
  <text x="515" y="144" fill="#8891a7" font-size="11" text-anchor="middle">User pool (auth)</text>

  <!-- API Gateway -->
  <rect x="440" y="200" width="150" height="60" rx="10" fill="#1c2333" stroke="#5b8cff"/>
  <text x="515" y="226" fill="#e6e9f0" font-size="13" text-anchor="middle">API Gateway</text>
  <text x="515" y="244" fill="#8891a7" font-size="11" text-anchor="middle">HTTP API, JWT auth</text>

  <!-- get_upload_url / list_jobs -->
  <rect x="650" y="170" width="170" height="50" rx="8" fill="#171c28" stroke="#232939"/>
  <text x="735" y="199" fill="#e6e9f0" font-size="12" text-anchor="middle">Lambda: get-upload-url</text>
  <rect x="650" y="230" width="170" height="50" rx="8" fill="#171c28" stroke="#232939"/>
  <text x="735" y="259" fill="#e6e9f0" font-size="12" text-anchor="middle">Lambda: list-jobs</text>

  <!-- S3 uploads bucket -->
  <rect x="30" y="330" width="170" height="60" rx="10" fill="#1c2333" stroke="#5b8cff"/>
  <text x="115" y="356" fill="#e6e9f0" font-size="13" text-anchor="middle">S3: uploads bucket</text>
  <text x="115" y="374" fill="#8891a7" font-size="11" text-anchor="middle">incoming/ &amp; results/</text>

  <!-- EventBridge -->
  <rect x="250" y="330" width="160" height="60" rx="10" fill="#1c2333" stroke="#ffb454"/>
  <text x="330" y="356" fill="#e6e9f0" font-size="13" text-anchor="middle">EventBridge</text>
  <text x="330" y="374" fill="#8891a7" font-size="11" text-anchor="middle">Object Created rule</text>

  <!-- Step Functions -->
  <rect x="460" y="320" width="200" height="80" rx="10" fill="#1c2333" stroke="#7c5cff"/>
  <text x="560" y="348" fill="#e6e9f0" font-size="13" text-anchor="middle">Step Functions</text>
  <text x="560" y="366" fill="#8891a7" font-size="11" text-anchor="middle">Validate → Transform →</text>
  <text x="560" y="382" fill="#8891a7" font-size="11" text-anchor="middle">ApplyRules → StoreAndNotify</text>

  <!-- 4 pipeline lambdas -->
  <rect x="720" y="290" width="150" height="40" rx="8" fill="#171c28" stroke="#232939"/>
  <text x="795" y="315" fill="#e6e9f0" font-size="11" text-anchor="middle">Lambda: validate</text>
  <rect x="720" y="335" width="150" height="40" rx="8" fill="#171c28" stroke="#232939"/>
  <text x="795" y="360" fill="#e6e9f0" font-size="11" text-anchor="middle">Lambda: transform</text>
  <rect x="720" y="380" width="150" height="40" rx="8" fill="#171c28" stroke="#232939"/>
  <text x="795" y="405" fill="#e6e9f0" font-size="11" text-anchor="middle">Lambda: apply-rules</text>
  <rect x="720" y="425" width="150" height="40" rx="8" fill="#171c28" stroke="#232939"/>
  <text x="795" y="450" fill="#e6e9f0" font-size="11" text-anchor="middle">Lambda: store-notify</text>

  <!-- Catch / failure path -->
  <rect x="460" y="470" width="200" height="50" rx="10" fill="#241820" stroke="#ff5c7a"/>
  <text x="560" y="500" fill="#ff5c7a" font-size="12" text-anchor="middle">Catch → Lambda: handle-failure</text>

  <rect x="720" y="470" width="150" height="40" rx="8" fill="#241820" stroke="#ff5c7a"/>
  <text x="795" y="495" fill="#ff5c7a" font-size="11" text-anchor="middle">SQS: failed-jobs DLQ</text>

  <!-- SNS -->
  <rect x="920" y="380" width="150" height="50" rx="8" fill="#171c28" stroke="#35d399"/>
  <text x="995" y="410" fill="#e6e9f0" font-size="12" text-anchor="middle">SNS: notifications</text>

  <!-- DynamoDB -->
  <rect x="250" y="470" width="170" height="60" rx="10" fill="#1c2333" stroke="#5b8cff"/>
  <text x="335" y="496" fill="#e6e9f0" font-size="13" text-anchor="middle">DynamoDB</text>
  <text x="335" y="514" fill="#8891a7" font-size="11" text-anchor="middle">jobs table (status/history)</text>

  <!-- CloudWatch -->
  <rect x="920" y="290" width="150" height="50" rx="8" fill="#171c28" stroke="#232939"/>
  <text x="995" y="320" fill="#8891a7" font-size="12" text-anchor="middle">CloudWatch Logs</text>

  <!-- Terraform / GH Actions strip -->
  <rect x="30" y="620" width="1120" height="70" rx="10" fill="#12161f" stroke="#232939"/>
  <text x="50" y="648" fill="#e6e9f0" font-size="13" font-weight="600">Everything above is defined as Terraform (Infrastructure as Code)</text>
  <text x="50" y="668" fill="#8891a7" font-size="12">GitHub Actions assumes an OIDC role and runs `terraform apply` + syncs the frontend + invalidates CloudFront on every push to main.</text>

  <!-- Arrows -->
  <line x1="180" y1="130" x2="228" y2="130" stroke="#5b8cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="130" x2="438" y2="130" stroke="#5b8cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="515" y1="160" x2="515" y2="198" stroke="#5b8cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="195" x2="648" y2="195" stroke="#5b8cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="255" x2="648" y2="255" stroke="#5b8cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="735" y1="220" x2="115" y2="330" stroke="#5b8cff" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="420" y="270" fill="#8891a7" font-size="10">presigned PUT</text>

  <line x1="200" y1="360" x2="248" y2="360" stroke="#ffb454" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="360" x2="458" y2="360" stroke="#7c5cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="345" x2="718" y2="310" stroke="#7c5cff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="560" y1="400" x2="560" y2="468" stroke="#ff5c7a" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="660" y1="495" x2="718" y2="490" stroke="#ff5c7a" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="870" y1="445" x2="995" y2="428" stroke="#35d399" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="560" y1="470" x2="335" y2="500" stroke="#5b8cff" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="400" y="480" fill="#8891a7" font-size="10">status writes</text>
  <line x1="735" y1="280" x2="995" y2="290" stroke="#8891a7" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="2 3"/>

  <line x1="115" y1="330" x2="330" y2="240" stroke="#5b8cff" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="795" y1="270" x2="735" y2="220" stroke="#8891a7" stroke-width="0" />
</svg>
